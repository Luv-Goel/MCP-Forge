services:
  api:
    build:
      context: ./apps/api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATA_FILE: /data/packages.json
      RATE_LIMIT_MAX: 120
      RATE_LIMIT_WINDOW: 1 minute
    volumes:
      - registry-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  registry-data:
