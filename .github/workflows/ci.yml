name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: Python toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate example manifests
        run: |
          python cli/bin/mcp-validate examples/mcp.package.json
          python cli/bin/mcp-validate examples/echo-server.mcp.package.json
      - name: Run tests
        run: python -m pytest tests/ -v

  api:
    name: Registry API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/api
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Run tests
        run: npx vitest run
        working-directory: apps/api

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Build
        run: npm run build
        working-directory: apps/web
